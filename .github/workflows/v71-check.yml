name: V7.1 session checks
on:
  push:
    branches: [feature/ralph-v5-pesq-diagnostics]
    paths:
      - 'src/v71_session.py'
      - 'src/v71_colab_worker.py'
      - 'tools/v71_colab.py'
      - 'tests/test_v71_colab.py'
      - 'tools/ralph_v71.py'
      - 'tools/v72_parallel.py'
      - 'tests/test_v71.py'
      - '.github/workflows/v71-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v71-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pandas scipy soundfile einops
      - run: python -m compileall -q src tools tests
      - run: python -m unittest discover -s tests -p test_v71.py -v
      - run: python -m unittest discover -s tests -p test_v71_colab.py -v
      - run: python -m unittest discover -s tests -p test_v6_controller.py -v

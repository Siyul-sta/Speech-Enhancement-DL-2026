name: V7 bounded research checks
on:
  push:
    branches: [feature/ralph-v5-pesq-diagnostics]
    paths:
      - 'src/v7_objectives.py'
      - 'tools/v7_search.py'
      - 'tools/ralph_v7.py'
      - 'tools/ralph_v610.py'
      - 'tests/test_v7.py'
      - '.github/workflows/v7-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v7-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pandas scipy soundfile einops
      - run: python -m compileall -q src tools tests
      - run: python -m unittest discover -s tests -p test_v7.py -v
        env:
          V7_TEST_MP: '1'
      - run: python -m unittest discover -s tests -p test_v611_loop.py -v
      - run: python -m unittest discover -s tests -p test_v610_focus.py -v

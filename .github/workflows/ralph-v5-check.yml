name: Ralph V5 contracts
on:
  push:
    branches: [feature/ralph-v5-pesq-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q src tools tests
      - run: python -m unittest discover -s tests -p test_ralph_v4.py -v
      - run: python tools/ralph_v4.py --loop --v5-suite --codex-research
  cpu-models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy pandas scipy soundfile einops
      - run: python -m unittest discover -s tests -p test_v51_preflight.py -v
      - run: python -m unittest discover -s tests -p test_v52_phase_critic.py -v
      - run: python -m unittest discover -s tests -p test_v53_transfer.py -v
        env:
          V5_TEST_PUBLIC_CMGAN: '1'
      - run: python -m unittest discover -s tests -p test_v5_improvements.py -v
        env:
          V5_TEST_PUBLIC_CMGAN: '1'
